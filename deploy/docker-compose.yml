# Hạ tầng local của snaptix (P0-T02).
#
#   docker compose -f deploy/docker-compose.yml up -d --wait
#
# - Chạy được khi chưa có deploy/.env: mọi biến đều có giá trị mặc định (cú pháp ":-"),
#   khớp deploy/.env.example và bảng "Cổng mặc định" của local-setup.md.
# - Image pin phiên bản cụ thể (không :latest).
# - Mọi service có healthcheck thật (probe thành phần đang phục vụ), để
#   `up --wait` chỉ trả về khi cả stack dùng được.
# - Cấu hình observability nằm trong deploy/observability/<service>/ và được
#   COPY vào image build local (pull_policy: build → mỗi `up` build lại, có
#   cache, nên sửa cấu hình rồi `up` là container được tạo lại). Không bind
#   mount file từ repo: trên macOS, Docker Desktop treo khi mount thư mục
#   trong ~/Documents mà chưa được cấp quyền (TCC); build context thì đọc
#   bằng CLI phía host nên không bị ảnh hưởng. Image build ra chỉ ở local.
name: snaptix

services:
  postgres-core:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snaptix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snaptix}
      POSTGRES_DB: ${POSTGRES_CORE_DB:-core}
    ports:
      - "${POSTGRES_CORE_PORT:-5432}:5432"
    volumes:
      # PG 18: PGDATA=/var/lib/postgresql/18/docker, VOLUME của image là /var/lib/postgresql.
      - postgres-core-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: đi qua TCP, nên không "healthy" nhầm lúc server tạm của
      # docker-entrypoint (chỉ nghe unix socket) đang chạy script init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres-analytics:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snaptix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snaptix}
      POSTGRES_DB: ${POSTGRES_ANALYTICS_DB:-analytics}
    ports:
      - "${POSTGRES_ANALYTICS_PORT:-5433}:5432"
    volumes:
      - postgres-analytics-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mongodb:
    image: mongo:8.0.32
    environment:
      # Image đặt glibc.pthread.rseq=0 để TCMalloc dùng per-CPU cache (cần rseq).
      # Với kernel Linux ≥ 6.19 (Docker Desktop hiện dùng 7.0.x) mongod 8.x từ
      # chối khởi động vì lỗi tương thích (SERVER-121912). rseq=1 → glibc giữ
      # rseq, TCMalloc về per-thread cache, mongod chạy bình thường.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      # Exit ≠ 0 khi không kết nối được hoặc ping không trả ok=1.
      test: ["CMD", "mongosh", "--quiet", "mongodb://127.0.0.1:27017/snaptix", "--eval", "quit(db.runCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    # Image gốc otel/opentelemetry-collector-contrib không có shell/wget và CLI
    # không có lệnh health → build image riêng (binary collector trên alpine đã
    # pin) để probe được extension health_check (13133).
    build:
      context: ./observability/otel-collector
    image: snaptix/otel-collector:0.161.0
    pull_policy: build
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  prometheus:
    build:
      context: ./observability/prometheus
    image: snaptix/prometheus:v3.15.0
    pull_policy: build
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Nhận metric OTLP do otel-collector đẩy vào /api/v1/otlp/v1/metrics.
      - --web.enable-otlp-receiver
    # Scrape /metrics của service chạy trên host (job core). Docker Desktop có
    # sẵn host.docker.internal; Linux cần ánh xạ tới host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  tempo:
    build:
      context: ./observability/tempo
    image: snaptix/tempo:3.0.3
    pull_policy: build
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    healthcheck:
      # Cờ có sẵn từ Tempo 3.x: gọi GET http://localhost:3200/ready, exit ≠ 0 nếu không 200.
      test: ["CMD", "/tempo", "-health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  grafana:
    build:
      context: ./observability/grafana
    image: snaptix/grafana:13.2.2
    pull_policy: build
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      # /api/health trả 503 khi DB nội bộ của Grafana lỗi.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres-core-data:
  postgres-analytics-data:
  mongodb-data:
  mongodb-config:
  redis-data:
  prometheus-data:
  tempo-data:
