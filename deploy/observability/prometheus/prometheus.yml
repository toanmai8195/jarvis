# Prometheus (P0-T02).
# Metric của app đi vào qua OTLP (otel-collector đẩy tới /api/v1/otlp, cần cờ
# --web.enable-otlp-receiver). Scrape chỉ dùng cho chính Prometheus và
# self-telemetry của otel-collector. Target core/bff thêm từ P0-T07+.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # Giữ vài resource attribute hay dùng làm label (ngoài job/instance tự sinh
  # từ service.name/service.instance.id).
  promote_resource_attributes:
    - service.namespace
    - deployment.environment.name

storage:
  tsdb:
    # OTLP push có thể đến trễ / lệch thứ tự giữa các batch.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
