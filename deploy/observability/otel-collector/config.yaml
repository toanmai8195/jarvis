# otel-collector (P0-T02): app → OTLP 4317/4318 → collector
#   trace  → Tempo (OTLP gRPC tempo:4317)
#   metric → Prometheus (OTLP HTTP, --web.enable-otlp-receiver)
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/prometheus:
    # Exporter tự nối /v1/metrics → http://prometheus:9090/api/v1/otlp/v1/metrics
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
