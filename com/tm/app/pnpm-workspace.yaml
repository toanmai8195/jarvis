packages:
  - "apps/*"
  - "packages/*"
# pnpm 11 chặn build script của dependency: duyệt tường minh từng package.
# esbuild (tsup, tsx) cần postinstall để chọn binary theo platform.
# protobufjs (kéo theo exporter OTLP proto của bff): postinstall chỉ kiểm
# phiên bản cho CLI pbjs, runtime không cần → không cho chạy.
allowBuilds:
  esbuild: true
  protobufjs: false
