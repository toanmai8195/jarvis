# golangci-lint v2 — cấu hình cho toàn module com/tm/server.
# Phiên bản pin: v2.14.0 (cùng bản trong .github/workflows/ci.yml và
# com/tm/docs/technical/local-setup.md). Chạy: cd com/tm/server && golangci-lint run ./...
version: "2"

run:
  # Phiên bản Go lấy từ go.mod (không ghi lặp ở đây).
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  exclusions:
    # Không bật preset std-error-handling: bỏ qua lỗi của os.Remove, Close...
    # cũng phải được xử lý hoặc bỏ có chủ đích (`_ =`).
    generated: lax

formatters:
  enable:
    - gofmt
